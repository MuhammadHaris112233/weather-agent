
name: Daily weather briefing

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent two weather agent runs from executing simultaneously
concurrency:
  group: daily-weather-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Run the agent
        run: python agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

          CITY: ${{ vars.CITY }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}

          FORCE_RUN: "0"

      - name: Save the log back to the repo
        if: always()
        run: |
          git config user.name "weather-agent"
          git config user.email "weather-agent@users.noreply.github.com"

          git add data/weather_log.csv

          if [ -f data/email_delivery.json ]; then
            git add data/email_delivery.json
          fi

          git diff --staged --quiet || (
            git commit -m "Update weather log and delivery record"
            git push
          )
