name: Daily weather briefing

on:
  schedule:
    - cron: "5 6 * * *"
    - cron: "5 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install anthropic requests
      - name: Run the agent
        run: python agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CITY: ${{ vars.CITY }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Save the log back to the repo
        run: |
          git config user.name "weather-agent"
          git config user.email "weather-agent@users.noreply.github.com"
          git add data/weather_log.csv
          git diff --staged --quiet || (git commit -m "Update weather log" && git push)
