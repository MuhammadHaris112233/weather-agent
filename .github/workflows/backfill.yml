name: Backfill last 30 days (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python backfill.py
        env:
          CITY: ${{ vars.CITY }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
      - run: |
          git config user.name "weather-agent"
          git config user.email "weather-agent@users.noreply.github.com"
          git add data/weather_log.csv
          git diff --staged --quiet || (git commit -m "Backfill 30 days" && git push)
